<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in – {{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/style_v2.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated ambient blobs behind the card */
        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .login-bg-blob {
            position: absolute;
            border-radius: 999px;
            filter: blur(90px);
            opacity: 0.28;
            animation: blob-drift 14s ease-in-out infinite alternate;
        }

        .login-bg-blob:nth-child(1) {
            width: 520px;
            height: 380px;
            background: radial-gradient(circle, #76e4d6, transparent 70%);
            top: -120px;
            left: -100px;
            animation-duration: 16s;
        }

        .login-bg-blob:nth-child(2) {
            width: 420px;
            height: 340px;
            background: radial-gradient(circle, #f4c76b, transparent 70%);
            bottom: -80px;
            right: -80px;
            opacity: 0.18;
            animation-duration: 20s;
            animation-direction: alternate-reverse;
        }

        .login-bg-blob:nth-child(3) {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #6ed1ff, transparent 70%);
            top: 50%;
            left: 60%;
            opacity: 0.12;
            animation-duration: 18s;
        }

        @keyframes blob-drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(30px, -20px) scale(1.05); }
            66%  { transform: translate(-20px, 18px) scale(0.97); }
            100% { transform: translate(18px, 12px) scale(1.03); }
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            animation: card-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes card-rise {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            padding: 36px 32px 32px;
            border-color: rgba(118, 228, 214, 0.18);
            box-shadow:
                0 0 0 1px rgba(118, 228, 214, 0.08),
                0 32px 80px rgba(0, 0, 0, 0.5),
                0 0 120px rgba(118, 228, 214, 0.06);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .login-brand-dot {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow:
                0 0 0 4px rgba(118, 228, 214, 0.15),
                0 0 28px rgba(118, 228, 214, 0.6);
            animation: dot-pulse 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes dot-pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(118, 228, 214, 0.15), 0 0 28px rgba(118, 228, 214, 0.6); }
            50%       { box-shadow: 0 0 0 7px rgba(118, 228, 214, 0.08), 0 0 44px rgba(118, 228, 214, 0.4); }
        }

        .login-brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .login-heading {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
            background: linear-gradient(160deg, #ffffff 30%, #a8bbd0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-sub {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 28px;
            line-height: 1.5;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .login-field-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
        }

        .login-field input[type="password"] {
            width: 100%;
            min-height: 50px;
            font-size: 1rem;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(5, 7, 11, 0.7);
            color: var(--text);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .login-field input[type="password"]:focus {
            outline: none;
            border-color: rgba(118, 228, 214, 0.55);
            box-shadow: 0 0 0 3px rgba(118, 228, 214, 0.12), 0 0 20px rgba(118, 228, 214, 0.08);
        }

        .login-submit {
            width: 100%;
            min-height: 50px;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid rgba(118, 228, 214, 0.42);
            border-radius: 10px;
            background: linear-gradient(160deg, #87f3e7 0%, #28c7b8 100%);
            color: #051210;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
            box-shadow: 0 4px 22px rgba(118, 228, 214, 0.22);
            position: relative;
            overflow: hidden;
        }

        .login-submit::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .login-submit:hover {
            background: linear-gradient(160deg, #a4fff4 0%, #37d7c8 100%);
            box-shadow: 0 6px 32px rgba(118, 228, 214, 0.35);
            transform: translateY(-1px);
        }

        .login-submit:hover::after {
            transform: translateX(100%);
        }

        .login-submit:active {
            transform: translateY(0);
        }

        .login-submit:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 111, 145, 0.3);
            border-radius: 10px;
            background: rgba(255, 111, 145, 0.1);
            color: #ffb3c2;
            font-size: 0.9rem;
            font-weight: 500;
            animation: error-shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        .login-error-icon {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 1.5px solid rgba(255, 111, 145, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--danger);
        }

        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(5px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(3px); }
        }

        /* Top shimmer line on the card */
        .login-card {
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(118, 228, 214, 0.8), rgba(244, 199, 107, 0.65), transparent);
            animation: shimmer-sweep 4s ease-in-out infinite;
        }

        @keyframes shimmer-sweep {
            0%, 100% { opacity: 0.6; }
            50%       { opacity: 1; }
        }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.78rem;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
            }

            .login-shell {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-bg" aria-hidden="true">
        <div class="login-bg-blob"></div>
        <div class="login-bg-blob"></div>
        <div class="login-bg-blob"></div>
    </div>

    <div class="login-shell">
        <div class="card login-card">
            <div class="login-brand">
                <span class="login-brand-dot"></span>
                <span class="login-brand-name">{{ app_name }}</span>
            </div>

            <h1 class="login-heading">Welcome back</h1>
            <p class="login-sub">Sign in to access your wallet tracker.</p>

            {% if error %}
            <div class="login-error">
                <span class="login-error-icon">!</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="login-field">
                    <span class="login-field-label">Password</span>
                    <input type="password" name="password" autofocus autocomplete="current-password" placeholder="Enter your password">
                </div>
                <button type="submit" class="login-submit">Sign in</button>
            </form>

            <p class="login-footer">Manual refresh only &mdash; reads from local database.</p>
        </div>
    </div>

    <script>
    document.querySelector('form').addEventListener('submit', function() {
        const btn = this.querySelector('.login-submit');
        if (btn && !btn.disabled) {
            btn.disabled = true;
            btn.textContent = 'Signing in…';
        }
    });
    </script>
</body>
</html>
