<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style_v2.css">
    <style>
        .login-shell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            margin-bottom: 24px;
        }
        .login-card label {
            display: block;
            margin-bottom: 16px;
        }
        .login-card input[type="password"] {
            width: 100%;
            margin-top: 4px;
        }
        .login-card .btn {
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="login-shell">
    <div class="card login-card">
        <h1>{{ app_name }}</h1>
        {% if error %}
        <div class="flash flash-error" style="margin-bottom:16px;"><strong>{{ error }}</strong></div>
        {% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next }}">
            <!-- No CSRF on login - password is the credential -->
            <label>
                Password
                <input type="password" name="password" autofocus autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
