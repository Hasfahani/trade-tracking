# Summary: Defines the local Docker Compose app stack.
# Details: It stores deployment or container settings so the app can run the same way outside the local machine.
services:
  app:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.11"
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: polysignal:local
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://polysignal:polysignal@db:5432/polysignal}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-change-this-password}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-this-session-secret-to-32-plus-characters}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      STARTUP_DB_MAX_ATTEMPTS: ${STARTUP_DB_MAX_ATTEMPTS:-20}
      STARTUP_DB_RETRY_SECONDS: ${STARTUP_DB_RETRY_SECONDS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      AI_CACHE_TTL_HOURS: ${AI_CACHE_TTL_HOURS:-72}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polysignal}
      POSTGRES_USER: ${POSTGRES_USER:-polysignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polysignal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ai-local
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

volumes:
  app-data:
  postgres-data:
  ollama-data:
