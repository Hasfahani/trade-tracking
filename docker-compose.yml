version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/trades.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-dev-secret-key-change-in-prod}
      # AI provider — set one of these for AI analysis
      # Claude (recommended — fastest, highest quality):
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      # Hugging Face (alternative cloud provider):
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      # Tuning
      - AI_CACHE_TTL_HOURS=${AI_CACHE_TTL_HOURS:-72}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-60}
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
      - ./app:/app/app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

volumes:
  ollama-data:
