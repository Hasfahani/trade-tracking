services:
  - type: web
    name: polysignal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: STARTUP_DB_MAX_ATTEMPTS
        value: "10"
      - key: STARTUP_DB_RETRY_SECONDS
        value: "2"
      - key: STARTUP_SEED_WALLETS
        value: "true"
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: polysignal-db
          property: connectionString

databases:
  - name: polysignal-db
    plan: free
    postgresMajorVersion: 16
